3%，单岗位资料整理耗时减少65%，工作效率显著提高。\nAI 模拟面试官\n· 工作流设计：在 Coze 搭建“简历解析→Query Builder→岗位面经知识库检索→大模型个性化出题→Interview Plan→多轮问答→复盘报告”完整链路。\n· 对话策略：设计开场提问、项目深挖、连续追问和总结反馈等对话策略，引导模型围绕候选人的简历经历进行针对性提问和匹配度评分\n· 测试迭代：建立问题相关性、追问有效性、评分一致性和报告完整度指标，使用典型回答与 bad case 持续优化 Prompt、知识库内容和工作流节点。\n· 项目效果：完成 20 次模拟面试测试，流程完成率达 96%，岗位相关问题人工抽检通过率达 85%。"},{"id":"6865934e-f3c4-4ef4-adba-4629b1e5b4c0","company":"佛山市开物设计有限公司","role":"工业设计实习","period":"2025.02 — 2025.06","keywords":[],"detail":"职责概述：参与产品设计需求评审、竞品和用户场景分析，负责交互方案设计，并协同客户、研发完成交付验收。\n欧美智能电子烟设计\n· 面向欧美市场梳理合规要求、设备状态和核心任务，完成屏幕信息架构、关键流程、状态反馈与动效方案。\n· 输出高保真原型及交互说明，通过多轮评审和场景走查修正细节，配合研发完成设计验收。\n智能净水器设计\n· 梳理控制面板高频任务与异常状态，优化操作步骤及水质、滤芯等关键信息反馈。\n· 使用 AI 辅助生成备选文案和界面方向，完成关键页面、状态规范与交付稿，提高方案迭代效率。"}],"layout":{"showPhoto":true,"accent":"#ffb3b3","moduleOffsetY":0},"style":{"color":"#ffffff","headingFontSize":76,"bodyFontSize":18,"headingAccentWords":2,"lineHeight":1.45,"bold":false},"motion":{"preset":"fade-up","duration":700}},{"id":"e51af5c2-dfb7-4693-851c-869d0e8fe4d5","type":"springDock","name":"常用工具","hidden":false,"groupId":"linshen-profile","data":{"heading":"常用工具","body":"TOOLS & SOFTWARE","sideNote":"TOOLS EMPOWER CREATIVITY"},"items":[{"id":"c4119354-2a94-4ba4-9286-6fe8f4432adf","src":"assets/asset-005-afe6a1893ef7.jpg"},{"id":"dc8ec95b-3f7b-4488-bae9-358caf368d57","src":"assets/asset-006-05e254b0643f.jpg"},{"id":"2f1d57d7-04a7-4fa9-bc7e-1e6876704caf","src":"assets/asset-007-be5041322fc3.jpg"},{"id":"f91bd7a7-2db8-4a96-8073-779d3639d194","src":"assets/asset-008-3a640a81d89d.jpg"},{"id":"f7a66f29-a3f1-4e3c-838a-bd738bfabc3d","src":"assets/asset-009-f4caf91c0802.jpg"},{"id":"5563f34f-6a75-4013-b764-3e6d342ffdb2","src":"assets/asset-010-1760ac27a1ec.jpg"},{"id":"b11fad58-933d-403b-a183-d098ee7c5b71","src":"assets/asset-011-278440e3f52e.jpg"},{"id":"ffd5db21-961e-41c5-8ab4-1aeb2b396456","src":"assets/asset-012-73aee958b109.jpg"}],"layout":{"itemCount":8,"speed":1.15,"accent":"#ff9494","shadow":true,"glow":false,"tileRatio":"3:4","tileScale":1,"dockStyl     let activeProjectKey = '';
    let scheduled = false;

    const getCompany = (entry) => entry.querySelector('.timeline-entry-company')?.textContent?.trim() || '';

    const copyContactValue = (value) => {
      const text = value?.trim();
      if (!text) return;
      const fallback = () => {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        textarea.remove();
      };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).catch(fallback);
      } else {
        fallback();
      }
    };

    const decorateTimeline = () => {
      document.querySelectorAll('.timeline-entry').forEach((entry) => {
        const company = getCompany(entry);
        if (company === '教育经历') {
          entry.classList.add('is-education');
          const educationIcon = entry.querySelector('.timeline-entry-switch');
          if (educationIcon) educationIcon.classList.add('is-on');
          const row = entry.querySelector('.timeline-entry-row');
          if (row && row.getAttribute('role') === 'button') {
            row.removeAttribute('role');
            row.removeAttribute('tabindex');
            row.removeAttribute('aria-expanded');
            row.setAttribute('aria-label', '教育经历');
          }
        }

        const role = entry.querySelector('.timeline-entry-role')?.textContent?.trim() || '';
        if (!role.includes('实习')) return;
        entry.querySelectorAll('.timeline-entry-detail-line').forEach((line) => {
          const text = line.textContent?.trim() || '';
          const isDutySummary = text.startsWith('职责概述：');
          line.classList.toggle('portfolio-pink-emphasis', projectTitlePattern.test(text));

          if (isDutySummary && !line.querySelector('.portfolio-duty-label')) {
            const detail = text.slice('职责概述：'.length);
            const label = document.createElement('span');
            const copy = document.createElement('span');
            label.className = 'portfolio-duty-label';
            label.textContent = '职责概述：';
            copy.className = 'portfolio-duty-copy';
            copy.textContent = detail;
            line.replaceChildren(label, copy);
          }
        });
      });
    };

    const setButtonState = (button, expanded) => {
      button.innerHTML = expanded ? collapseIcon : expandIcon;
      button.setAttribute('aria-label', expanded ? '退出全屏作品集' : '全屏展示作品集');
      button.setAttribute('title', expanded ? '退出全屏（Esc）' : '全屏展示作品集');
      button.setAttribute('aria-pressed', String(expanded));
    };

    const exitPseudoFullscreen = () => {
      const host = document.querySelector('.pd-archive-main.portfolio-pseudo-fullscreen');
      if (!host) return false;
      host.classList.remove('portfolio-pseudo-fullscreen');
      document.body.classList.remove('portfolio-pseudo-fullscreen-open');
      const button = host.querySelector('.pd-portfolio-fullscreen-button');
      if (button) setButtonState(button, false);
      return true;
    };

    const toggleFullscreen = async (button) => {
      const host = button.closest('.pd-archive-main');
      if (!host) return;

      if (document.fullscreenElement === host) {
        await document.exitFullscreen();
        return;
      }
      if (host.classList.contains('portfolio-pseudo-fullscreen')) {
        exitPseudoFullscreen();
        return;
      }

      if (host.requestFullscreen) {
        try {
          await host.requestFullscreen();
          return;
        } catch (error) {
          console.warn('Fullscreen API unavailable; using fixed fullscreen fallback.', error);
        }
      }

      host.classList.add('portfolio-pseudo-fullscreen');
      document.body.classList.add('portfolio-pseudo-fullscreen-open');
      setButtonState(button, true);
    };

    const updateContactProgress = (section, video) => {
      const duration = Number.isFinite(video.duration) && video.duration > 0 ? video.duration : 0;
      const progress = duration ? Math.min(1, Math.max(0, video.currentTime / duration)) : 0;
      const maskOpacity = 0.5 + progress * 0.4;
      const contentOpacity = Math.min(1, Math.max(0, (progress - 0.3) / 0.7));
      section.style.setProperty('--contact-mask-opacity', maskOpacity.toFixed(4));
      section.style.setProperty('--contact-content-opacity', contentOpacity.toFixed(4));
      section.style.setProperty('--contact-content-y', `${((1 - contentOpacity) * 18).toFixed(2)}px`);
      const screen = section.querySelector('.contact-screen');
      if (screen) screen.style.pointerEvents = contentOpacity > 0.2 ? 'auto' : 'none';
      section.dataset.contactProgress = progress.toFixed(4);
    };

    const decorateContact = () => {
      document.querySelectorAll('.portfolio-module-contact').forEach((section) => {
        section.querySelectorAll('a.contact-row-value[href^="mailto:"], a.contact-row-value[href^="tel:"]').forEach((link) => {
          link.setAttribute('role', 'button');
          link.setAttribute('aria-label', `复制${link.textContent?.trim() || '联系方式'}`);
        });
        const video = section.querySelector('.contact-bg-layer video');
        if (!video) return;
        section.classList.add('contact-video-sequenced');
        video.loop = false;
        video.removeAttribute('loop');
        video.muted = true;
        video.playsInline = true;

        if (video.__contactSequenceInitialized) {
          updateContactProgress(section, video);
          return;
        }
        video.__contactSequenceInitialized = true;
        video.pause();
        try { video.currentTime = 0; } catch {}
        updateContactProgress(section, video);

        let animationFrame = 0;
        const tick = () => {
          updateContactProgress(section, video);
          if (!video.paused && !video.ended) animationFrame = requestAnimationFrame(tick);
        };
        const startTick = () => {
          cancelAnimationFrame(animationFrame);
          animationFrame = requestAnimationFrame(tick);
        };
        const finishSequence = () => {
          cancelAnimationFrame(animationFrame);
          section.style.setProperty('--contact-mask-opacity', '0.9');
          section.style.setProperty('--contact-content-opacity', '1');
          section.style.setProperty('--contact-content-y', '0px');
          section.dataset.contactProgress = '1.0000';
          const screen = section.querySelector('.contact-screen');
          if (screen) screen.style.pointerEvents = 'auto';
        };

        video.addEventListener('loadedmetadata', () => updateContactProgress(section, video));
        video.addEventListener('timeupdate', () => updateContactProgress(section, video));
        video.addEventListener('play', startTick);
        video.addEventListener('pause', () => cancelAnimationFrame(animationFrame));
        video.addEventListener('ended', finishSequence);
        video.addEventListener('error', finishSequence);

        const visibilityObserver = new IntersectionObserver((entries) => {
          const entry = entries[0];
          if (entry.isIntersecting && entry.intersectionRatio >= 0.18) {
            if (video.ended || (video.duration && video.currentTime >= video.duration - 0.05)) {
              video.currentTime = 0;
              updateContactProgress(section, video);
            }
            video.play().catch(() => {});
          } else {
            video.pause();
          }
        }, { threshold: [0, 0.18, 0.35] });
        visibilityObserver.observe(section);
        video.__contactVisibilityObserver = visibilityObserver;
      });
    };
    const decorateProjects = () => {
      const activeRow = document.querySelector('.pd-archive-row.is-active');
      const nextKey = activeRow?.querySelector('.pd-archive-row-title')?.textContent?.trim() || '';

      document.querySelectorAll('.pd-archive-main').forEach((host) => {
        host.classList.toggle('portfolio-natural-cover', nextKey === '菲律宾金融贷款APP');
        const body = host.querySelector('.pd-archive-main-body');
        if (body) {
          const syncCoverHeight = () => {
            if (host.matches(':fullscreen') || host.classList.contains('portfolio-pseudo-fullscreen')) return;
            body.style.setProperty('--portfolio-cover-height', `${Math.max(1, body.clientHeight)}px`);
          };
          syncCoverHeight();
          if (!body.__portfolioCoverResizeObserver) {
            const resizeObserver = new ResizeObserver(syncCoverHeight);
            resizeObserver.observe(body);
            body.__portfolioCoverResizeObserver = resizeObserver;
          }
        }

        let button = host.querySelector('.pd-portfolio-fullscreen-button');
        if (!button) {
          button = document.createElement('button');
          button.type = 'button';
          button.className = 'pd-portfolio-fullscreen-button';
          setButtonState(button, false);
          button.addEventListener('click', (event) => {
            event.preventDefault();
            event.stopPropagation();
            toggleFullscreen(button);
          });
          host.appendChild(button);
        }
      });

      if (nextKey && nextKey !== activeProjectKey) {
        activeProjectKey = nextKey;
        document.querySelector('.pd-archive-main-body')?.scrollTo({ top: 0, behavior: 'instant' });
      }
    };

    const decorate = () => {
      scheduled = false;
      decorateTimeline();
      decorateContact();
      decorateProjects();
    };

    const scheduleDecorate = () => {
      if (scheduled) return;
      scheduled = true;
      requestAnimationFrame(decorate);
    };

    document.addEventListener('click', (event) => {
      const link = event.target.closest?.('.contact-row-value');
      if (!link?.matches?.('a[href^="mailto:"], a[href^="tel:"]')) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      copyContactValue(link.textContent || '');
    }, true);

    document.addEventListener('click', (event) => {
      const row = event.target.closest?.('.timeline-entry-row');
      if (!row) return;
      const entry = row.closest('.timeline-entry');
      if (!entry || getCompany(entry) !== '教育经历') return;
      if (row.getAttribute('role') === 'button' || event.target.closest('.timeline-entry-plus, .timeline-entry-switch')) {
        event.preventDefault();
        event.stopImmediatePropagation();
      }
    }, true);

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && exitPseudoFullscreen()) {
        event.preventDefault();
        return;
      }
      if (event.key !== 'Enter' && event.key !== ' ') return;
      const row = event.target.closest?.('.timeline-entry-row');
      const entry = row?.closest('.timeline-entry');
      if (entry && getCompany(entry) === '教育经历') {
        event.preventDefault();
        event.stopImmediatePropagation();
      }
    }, true);

    document.addEventListener('fullscreenchange', () => {
      document.querySelectorAll('.pd-portfolio-fullscreen-button').forEach((button) => {
        setButtonState(button, document.fullscreenElement === button.closest('.pd-archive-main'));
      });
    });

    const observer = new MutationObserver(scheduleDecorate);
    observer.observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });
    scheduleDecorate();

    window.__portfolioRequestPatch = {
      targetCompany,
      decorate,
      version: '2026-10-07-r13'
    };
  })();
</script>
<!-- portfolio-request-patch:end -->
